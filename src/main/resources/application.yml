# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_man?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Shared DB, per-service migration history (same isolation idea as MSX_BATCH_)
    database-change-log-table: msx_databasechangelog
    database-change-log-lock-table: msx_databasechangeloglock

dcre:
  # Persistent JDBC JobRepository prefix (BatchJdbcConfig reads via BatchProperties);
  # MSX runs on the default SERIALIZABLE isolation (no READ COMMITTED override; only
  # CRG carries RC per SCRUM-90).
  batch:
    table-prefix: MSX_BATCH_
  # Second read-write datasource for the HeartbeatWriter liveness stamp on
  # agt_ops.launch_intent (HeartbeatDatasourceConfig).
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../../infra/dcre-infra/exchange}
